name: Baseline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  checks:
    uses: metio/ci/.github/workflows/baseline.yml@481c52330329f9256f7f3d895da0ff54ede66603 # 2026.11.23065533
  baseline:
    name: Baseline
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.checks.result }}
        run: '[ "$RESULT" = success ] || { echo "::error::the baseline checks ended in $RESULT"; exit 1; }'
