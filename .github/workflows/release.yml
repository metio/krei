name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: gate
        uses: metio/ci/needs-release@21ce4ec08a0516b39fcd5985472f0d53ec11e338 # 2026.10.31095959
        with:
          paths: src resources bb.edn krei .breto.edn README.md
      - uses: metio/breto@3d35cbfa61e9b8e98fe3d92113390a6db219b66c # 2026.10.30182439
        if: steps.gate.outputs.needed == 'true'
        with:
          registries: github:metio/toolchains
      - name: Run the test suite before releasing
        if: steps.gate.outputs.needed == 'true'
        run: bb test
      - id: version
        if: steps.gate.outputs.needed == 'true'
        uses: metio/ci/calver@21ce4ec08a0516b39fcd5985472f0d53ec11e338 # 2026.10.31095959
      - id: notes
        name: Generate release notes
        if: steps.gate.outputs.needed == 'true'
        uses: metio/ci/release-notes@21ce4ec08a0516b39fcd5985472f0d53ec11e338 # 2026.10.31095959
        with:
          version: ${{ steps.version.outputs.version }}
          previous: ${{ steps.gate.outputs.last }}
      - name: Tag and publish the GitHub release
        if: steps.gate.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: gh release create "$VERSION" --target "$SHA" --notes-file "$NOTES" --title "$VERSION"
